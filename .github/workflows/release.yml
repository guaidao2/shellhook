name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布到 Release 的 tag，例如 v0.3.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: 编译
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o shellhook-linux-amd64 .
          ./shellhook-linux-amd64 -v
          sha256sum shellhook-linux-amd64 > shellhook-linux-amd64.sha256
          cat shellhook-linux-amd64.sha256

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.ver }}
          body: 发布 ${{ steps.v.outputs.ver }} 版本
          files: |
            shellhook-linux-amd64
            shellhook-linux-amd64.sha256
          fail_on_unmatched_files: true
